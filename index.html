<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Aya ❤️ — a love letter</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="%23fff" stroke="%23ff6e9c" stroke-width="2"/><circle cx="20" cy="18" r="16" fill="%23fff" stroke="%23ff477e" stroke-width="1.8"/><ellipse cx="13" cy="13" rx="2.2" ry="2.8" fill="%23222"/><ellipse cx="27" cy="13" rx="2.2" ry="2.8" fill="%23222"/><ellipse cx="20" cy="24" rx="2.5" ry="2" fill="%23f5c400" stroke="%23222" stroke-width="1.2"/><path d="M8 22 L14 22 M8 26 L14 26 M26 22 L32 22 M26 26 L32 26" stroke="%23222" stroke-width="1.5" stroke-linecap="round"/><circle cx="14" cy="10" r="1.5" fill="%23ffb6c1"/><circle cx="26" cy="10" r="1.5" fill="%23ffb6c1"/></svg>') 20 20, auto;
    }

    body {
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #fff0f7 0%, #ffd9e8 45%, #ffeef5 100%);
      color: #7a1f3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- FLOATING BACKGROUND HEARTS & ROSES ---------- */
    .bg-heart {
      position: absolute;
      font-size: 32px;
      opacity: 0.18;
      animation: floatUp linear infinite;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(200, 50, 100, 0.1));
    }

    .rose {
      position: absolute;
      font-size: 52px;
      animation: roseFloat 7s ease-in-out infinite;
      filter: drop-shadow(0 8px 12px rgba(160, 30, 80, 0.2));
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      15% { opacity: 0.3; }
      to { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
    }

    @keyframes roseFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-20px) rotate(6deg); }
    }

    /* ---------- MAIN CARD (PROFESSIONAL GLASS CARD) ---------- */
    .card {
      position: relative;
      width: min(92%, 620px);
      padding: 48px 32px 52px;
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 48px;
      border: 2px solid rgba(255, 150, 180, 0.5);
      box-shadow: 
        0 30px 80px rgba(180, 30, 90, 0.18),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 0 40px rgba(255, 100, 150, 0.15);
      z-index: 5;
      transition: box-shadow 0.4s;
      /* CRITICAL: this is the container for the button's movement */
      overflow: hidden;
    }

    .card:hover {
      box-shadow: 
        0 35px 100px rgba(180, 30, 90, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.9) inset,
        0 0 60px rgba(255, 100, 150, 0.2);
    }

    /* ---------- TRUE HELLO KITTY (SVG) ---------- */
    .kitty {
      width: 150px;
      height: 150px;
      margin: 0 auto 16px;
      position: relative;
      animation: bounce 2.8s ease-in-out infinite;
      filter: drop-shadow(0 8px 12px rgba(200, 60, 120, 0.18));
    }

    .kitty svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes bounce {
      50% { transform: translateY(-8px); }
    }

    /* ---------- TYPOGRAPHY ---------- */
    h1 {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(36px, 8vw, 62px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #c41e4f;
      text-shadow: 3px 3px 0 #ffd0df, 0 4px 14px rgba(200, 40, 90, 0.2);
      margin: 8px 0 6px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 400;
      color: #9b3a5e;
      margin-bottom: 20px;
      letter-spacing: 0.3px;
      font-style: italic;
    }

    .roses {
      font-size: 36px;
      letter-spacing: 10px;
      margin: 10px 0 28px;
      filter: drop-shadow(0 2px 4px rgba(200, 50, 100, 0.15));
    }

    /* ---------- BUTTON (CATCH MY HEART) ---------- */
    #loveButton {
      position: relative;
      padding: 18px 36px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(145deg, #ff4f88, #d91f5a);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 
        0 14px 30px rgba(217, 41, 98, 0.35),
        0 4px 0 #a8194a,
        0 0 0 2px rgba(255, 255, 255, 0.3) inset;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 10;
      font-family: inherit;
      white-space: nowrap;
    }

    #loveButton:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 
        0 18px 40px rgba(217, 41, 98, 0.45),
        0 6px 0 #a8194a,
        0 0 0 2px rgba(255, 255, 255, 0.4) inset;
    }

    #loveButton:active {
      transform: scale(0.98) translateY(2px);
      box-shadow: 
        0 8px 20px rgba(217, 41, 98, 0.3),
        0 2px 0 #a8194a;
    }

    /* The button moves within the card using absolute positioning */
    #loveButton.moving {
      position: absolute;
      transition: left 0.15s ease, top 0.15s ease;
    }

    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: #b05a7b;
      letter-spacing: 0.4px;
      font-weight: 500;
    }

    /* ---------- LOVE PAGE (OVERLAY) ---------- */
    #lovePage {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: radial-gradient(circle at center, #fff 0%, #ffd5e5 55%, #ffb8d1 100%);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    #lovePage.show {
      display: flex;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .loveBox {
      position: relative;
      width: min(92%, 720px);
      padding: 56px 28px 48px;
      border-radius: 52px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      border: 4px solid #ff6e9c;
      box-shadow: 
        0 30px 90px rgba(190, 30, 90, 0.28),
        0 0 0 2px rgba(255, 255, 255, 0.6) inset;
    }

    .loveTitle {
      font-family: "Georgia", serif;
      font-size: clamp(48px, 12vw, 100px);
      font-weight: 700;
      color: #d51e5b;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-shadow: 4px 4px 0 #ffd0df;
      animation: heartbeat 1.2s infinite;
    }

    .loveName {
      font-size: clamp(34px, 8vw, 64px);
      color: #ff477e;
      margin-top: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
    }

    .message {
      font-size: 21px;
      margin-top: 28px;
      color: #8b3154;
      line-height: 1.6;
      font-style: italic;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .back {
      margin-top: 32px;
      padding: 14px 32px;
      border: 2.5px solid #ff6e9c;
      border-radius: 999px;
      background: white;
      color: #d62962;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 6px 18px rgba(255, 110, 156, 0.2);
      font-family: inherit;
    }

    .back:hover {
      background: #fff0f5;
      transform: scale(1.04);
      box-shadow: 0 10px 25px rgba(255, 110, 156, 0.35);
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.07); }
      30% { transform: scale(1); }
      45% { transform: scale(1.04); }
    }

    /* ---------- PETALS (FALLING ON LOVE PAGE) ---------- */
    .petal {
      position: absolute;
      top: -40px;
      font-size: 28px;
      z-index: 25;
      animation: petalFall 5s linear forwards;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(200, 50, 100, 0.15));
    }

    @keyframes petalFall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .card {
        padding: 34px 20px 40px;
        border-radius: 36px;
      }
      .kitty {
        width: 120px;
        height: 120px;
      }
      .roses { font-size: 28px; letter-spacing: 6px; }
      #loveButton { font-size: 17px; padding: 15px 28px; }
    }
  </style>
</head>

<body>
  <div class="scene" id="scene">
    <!-- floating hearts -->
    <div class="bg-heart" style="left:4%;  animation-duration:8s;  animation-delay:0s">💗</div>
    <div class="bg-heart" style="left:16%; animation-duration:11s; animation-delay:2s">💖</div>
    <div class="bg-heart" style="left:32%; animation-duration:9s;  animation-delay:4s">💕</div>
    <div class="bg-heart" style="left:52%; animation-duration:12s; animation-delay:1s">💗</div>
    <div class="bg-heart" style="left:70%; animation-duration:10s; animation-delay:3s">💖</div>
    <div class="bg-heart" style="left:88%; animation-duration:9s;  animation-delay:5s">💕</div>

    <!-- roses -->
    <div class="rose" style="left:2%;  top:10%; animation-delay:0s">🌹</div>
    <div class="rose" style="right:4%; top:14%; animation-delay:1s">🌹</div>
    <div class="rose" style="left:6%;  bottom:8%; animation-delay:2s">🌹</div>
    <div class="rose" style="right:6%; bottom:6%; animation-delay:3s">🌹</div>
    <div class="rose" style="left:46%; top:4%;  font-size:38px; animation-delay:0.5s">🌹</div>

    <!-- main card -->
    <main class="card" id="mainCard">
      <div class="kitty" aria-label="true hello kitty">
        <!-- True Hello Kitty SVG matching the photo -->
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- LEFT EAR -->
          <path d="M 65 55 Q 55 25 75 15 Q 90 10 95 45 Z" fill="white" stroke="black" stroke-width="4.5" stroke-linejoin="round"/>
          <!-- RIGHT EAR -->
          <path d="M 135 55 Q 145 25 125 15 Q 110 10 105 45 Z" fill="white" stroke="black" stroke-width="4.5" stroke-linejoin="round"/>
          
          <!-- BODY / DRESS (red) -->
          <path d="M 70 115 Q 60 150 65 170 Q 75 185 100 185 Q 125 185 135 170 Q 140 150 130 115 Z" fill="#e8154a" stroke="black" stroke-width="4.5" stroke-linejoin="round"/>
          
          <!-- ARMS -->
          <path d="M 70 125 Q 50 135 45 155 Q 42 165 55 168 Q 65 170 68 155 Q 70 140 75 130 Z" fill="white" stroke="black" stroke-width="4.5" stroke-linejoin="round"/>
          <path d="M 130 125 Q 150 135 155 155 Q 158 165 145 168 Q 135 170 132 155 Q 130 140 125 130 Z" fill="white" stroke="black" stroke-width="4.5" stroke-linejoin="round"/>
          
          <!-- FEET (white) -->
          <ellipse cx="80" cy="182" rx="18" ry="12" fill="white" stroke="black" stroke-width="4.5"/>
          <ellipse cx="120" cy="182" rx="18" ry="12" fill="white" stroke="black" stroke-width="4.5"/>
          
          <!-- HEAD -->
          <ellipse cx="100" cy="75" rx="48" ry="42" fill="white" stroke="black" stroke-width="4.5"/>
          
          <!-- BOW -->
          <g transform="translate(135, 42)">
            <!-- left bow loop -->
            <path d="M 0 0 Q -20 -20 -28 -5 Q -35 10 -15 15 Q 0 18 5 5 Z" fill="#e8154a" stroke="black" stroke-width="4" stroke-linejoin="round"/>
            <!-- right bow loop -->
            <path d="M 5 0 Q 25 -20 33 -5 Q 40 10 20 15 Q 5 18 0 5 Z" fill="#e8154a" stroke="black" stroke-width="4" stroke-linejoin="round"/>
            <!-- bow center -->
            <circle cx="2" cy="6" r="6" fill="#e8154a" stroke="black" stroke-width="4"/>
          </g>
          
          <!-- EYES -->
          <ellipse cx="80" cy="72" rx="5" ry="7" fill="black"/>
          <ellipse cx="120" cy="72" rx="5" ry="7" fill="black"/>
          
          <!-- NOSE -->
          <ellipse cx="100" cy="85" rx="5" ry="3.5" fill="#f5c400" stroke="black" stroke-width="3"/>
          
          <!-- WHISKERS (left) -->
          <line x1="42" y1="68" x2="65" y2="72" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="40" y1="80" x2="65" y2="80" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="42" y1="92" x2="65" y2="88" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
          
          <!-- WHISKERS (right) -->
          <line x1="158" y1="68" x2="135" y2="72" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="160" y1="80" x2="135" y2="80" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="158" y1="92" x2="135" y2="88" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
          
          <!-- DRESS NECKLINE -->
          <path d="M 78 118 Q 100 128 122 118" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <h1>For Aya ❤️</h1>
      <p class="subtitle">A little page made with a lot of love…</p>
      <div class="roses">🌹 💕 🌹 💕 🌹</div>

      <button id="loveButton">Catch my heart ❤️</button>
      <p class="hint">Try to catch the button… 👀</p>
    </main>

    <!-- love overlay page -->
    <section id="lovePage">
      <div class="loveBox">
        <div style="font-size:60px; filter:drop-shadow(0 6px 10px rgba(200,50,100,0.2))">🌹 💗 🌹</div>
        <div class="loveTitle">I LOVE YOU</div>
        <div class="loveName">AYA ❤️</div>
        <p class="message">You are my favorite person in this whole world. 🌸<br>Every moment with you feels like a dream.</p>
        <p style="font-size:42px; margin-top:22px; letter-spacing:6px;">🌹 💕 🌹 💕 🌹</p>
        <button class="back" onclick="closeLove()">Back to our little page</button>
      </div>
    </section>
  </div>

  <script>
    const button = document.getElementById("loveButton");
    const card = document.getElementById("mainCard");
    let tries = 0;

    function moveButton() {
      tries++;
      if (tries < 6) {
        // Switch to absolute positioning inside the card
        button.classList.add("moving");
        
        // Get the card's inner dimensions (accounting for padding & border)
        const cardRect = card.getBoundingClientRect();
        const btnWidth = button.offsetWidth;
        const btnHeight = button.offsetHeight;
        
        // Safe padding so the button never touches the card's edges
        const pad = 20;
        
        // Maximum X and Y positions INSIDE the card
        const maxX = cardRect.width - btnWidth - pad * 2;
        const maxY = cardRect.height - btnHeight - pad * 2;
        
        // Random position within the card (relative to card's top-left)
        const x = pad + Math.random() * Math.max(0, maxX);
        const y = pad + Math.random() * Math.max(0, maxY);
        
        button.style.left = x + "px";
        button.style.top = y + "px";
        button.textContent = ["Catch me ❤️", "Almost! 😘", "Try again 🌹", "So close! 💕", "One more! ❤️"][tries - 1];
      } else {
        showLove();
      }
    }

    button.addEventListener("mouseenter", moveButton);
    button.addEventListener("touchstart", function (e) {
      e.preventDefault();
      moveButton();
    });
    button.addEventListener("click", function () {
      if (tries >= 5) showLove();
    });

    function showLove() {
      document.getElementById("lovePage").classList.add("show");
      for (let i = 0; i < 40; i++) {
        setTimeout(createPetal, i * 70);
      }
    }

    function closeLove() {
      document.getElementById("lovePage").classList.remove("show");
      tries = 0;
      button.classList.remove("moving");
      button.style.left = "";
      button.style.top = "";
      button.textContent = "Catch my heart ❤️";
    }

    function createPetal() {
      const p = document.createElement("div");
      p.className = "petal";
      p.textContent = Math.random() > 0.35 ? "🌹" : "💗";
      p.style.left = Math.random() * 100 + "vw";
      p.style.fontSize = (18 + Math.random() * 24) + "px";
      p.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 6500);
    }
  </script>
</body>
</html>
